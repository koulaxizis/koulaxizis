<!-- test-manifest.html -->
<!DOCTYPE html>
<html>
<head>
    <title>PWA Test</title>
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <h1>PWA Test</h1>
    <script>
        fetch('/manifest.json')
            .then(r => r.json())
            .then(m => {
                console.log('Manifest loaded:', m);
                document.body.innerHTML += '<p style="color:green">✅ Manifest loaded!</p>';
            })
            .catch(e => {
                console.error('Manifest error:', e);
                document.body.innerHTML += '<p style="color:red">❌ Manifest error: ' + e + '</p>';
            });
    </script>
</body>
</html>
