<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Ενημερώσεων - Χρήστος Κουλαξίζης</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <h1>📝 Νέα Ενημέρωση</h1>

    <!-- Token Section -->
    <div class="token-section">
        <button type="button" class="toggle-btn" id="tokenToggle">🔐 GitHub Token</button>
        <div class="toggle-wrapper" id="tokenWrapper">
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxx...">
            <div id="tokenStatus"></div>
        </div>
    </div>

    <!-- Social Media Settings -->
    <div class="token-section">
        <button type="button" class="toggle-btn" id="socialToggle">📱 Social Media & Hashtags</button>
        <div class="toggle-wrapper" id="socialWrapper">
            <label class="option-row">
                <input type="checkbox" id="blueskyPost">
                <span class="custom-check"></span>
                <span>BlueSky / Mastodon Auto-Post</span>
            </label>
            <label class="option-row">
                <input type="checkbox" id="hashtagsConvert" checked>
                <span class="custom-check"></span>
                <span>Μετατροπή Emojis σε Hashtags (English)</span>
            </label>
        </div>
    </div>

    <!-- Main Form -->
    <div class="form-group">
        <div class="date-time-row">
            <div class="field">
                <label>Ημερομηνία</label>
                <input type="text" id="date" readonly>
            </div>
            <div class="field">
                <label>Ώρα</label>
                <input type="text" id="time" readonly>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="content-header">
            <label for="content">Κείμενο</label>
            <div id="charCounter" class="char-counter">0 <small>(Status Cafe)</small></div>
        </div>
        <textarea id="content" placeholder="Γράψε εδώ..." rows="5"></textarea>
        
        <div id="hashtagPreview" class="hashtag-preview">
            <strong>Preview:</strong>
            <span id="previewContent"></span>
        </div>

        <div class="tags-row">
            <div class="tags-container" id="tagsContainer">
                <span class="empty-msg">Επίλεξε emojis ως tags</span>
            </div>
        </div>

        <div class="dropdown-container">
            <button type="button" class="dropdown-toggle" id="emojiDropdownBtn">
                <span>😊 Επιλογή Emoji Tags</span>
                <span>▼</span>
            </button>
            <div id="emojiDropdownMenu" class="dropdown-menu">
                <input type="text" id="emojiSearch" class="search-input" placeholder="🔍 Αναζήτηση emoji...">
                
                <!-- Recent Emojis -->
                <div id="recentEmojisCategory" class="emoji-category hidden">
                    <div class="category-title">✨ Πρόσφατα χρησιμοποιημένα</div>
                    <div class="char-grid" id="recentEmojisGrid"></div>
                </div>

                <!-- Categories will be injected from emoji-data.js -->
                <div id="emojiCategoriesContainer"></div>
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button type="button" id="submitBtn">📤 Αποστολή</button>
        <button type="button" id="clearBtn">🗑️ Καθαρισμός</button>
    </div>

    <div id="status" role="alert"></div>

    <!-- Scripts -->
    <script src="emoji-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
