<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Ενημερώσεων - Χρήστος Κουλαξίζης</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 2rem; max-width: 600px; margin: 0 auto; }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 1rem; background: #bb86fc; color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #9965f4; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>📝 Νέα Ενημέρωση</h1>
    
    <div class="form-group">
        <label for="date">Ημερομηνία (YYYY-MM-DD)</label>
        <input type="date" id="date" required>
    </div>

    <div class="form-group">
        <label for="time">Ώρα (HH:MM)</label>
        <input type="time" id="time" required>
    </div>

    <div class="form-group">
        <label for="content">Περιεχόμενο</label>
        <textarea id="content" placeholder="Γράψε την ενημέρωσή σου εδώ..." required></textarea>
    </div>

    <button id="submitBtn">Αποστολή & Auto Commit</button>
    <div id="status"></div>

    <script>
        // --- 1. ΡΥΘΜΙΣΕΙΣ ---
        const GITHUB_USER = 'koulaxizis';       
        const REPO_NAME = 'koulaxizis'; // <--- ΕΛΕΓΞΕ ΑΥΤΟ!
        const TOKEN = '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';                  // <--- Βάλε το token
        const BRANCH = 'main';                    // <--- Έλεγχος branch

        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const dateInput = document.getElementById('date');
        const timeInput = document.getElementById('time');
        const contentInput = document.getElementById('content');

        const now = new Date();
        dateInput.valueAsDate = now;
        timeInput.value = now.toTimeString().substring(0, 5);

        function formatDate(dateStr, timeStr) {
            const [year, month, day] = dateStr.split('-');
            const months = ['Ιανουαρίου', 'Φεβρουαρίου', 'Μαρτίου', 'Απριλίου', 'Μαΐου', 'Ιουνίου', 'Ιουλίου', 'Αυγούστου', 'Σεπτεμβρίου', 'Οκτωβρίου', 'Νοεμβρίου', 'Δεκεμβρίου'];
            return `${day} ${months[parseInt(month)-1]} ${year}, ${timeStr}`;
        }

        // --- ΒΟΗΘΗΤΙΚΕΣ ΣΥΝΑΡΤΗΣΕΙΣ ΓΙΑ UNICODE (ΕΛΛΗΝΙΚΑ) ---
        // Αυτές διασφαλίζουν ότι τα ελληνικά δεν θα χαλάσουν
        function safeBase64Encode(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        function safeBase64Decode(str) {
            return decodeURIComponent(escape(atob(str)));
        }

        submitBtn.addEventListener('click', async () => {
            const date = dateInput.value;
            const time = timeInput.value;
            const content = contentInput.value.trim();

            if (!date || !time || !content) {
                alert('Παρακαλώ συμπλήρωσε όλα τα πεδία!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Αποστολή...';
            statusDiv.style.display = 'none';

            try {
                // 1. Λήψη του τρέχοντος updates.json
                const fileUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/updates.json?ref=${BRANCH}`;
                const fileRes = await fetch(fileUrl, {
                    headers: { Authorization: `token ${TOKEN}` }
                });

                if (!fileRes.ok) {
                    const err = await fileRes.json();
                    throw new Error(err.message || 'Δεν βρέθηκε το αρχείο updates.json.');
                }
                
                const fileData = await fileRes.json();
                
                // ΔΙΟΡΘΩΣΗ: Χρήση safeBase64Decode για σωστή ανάγνωση ελληνικών
                const currentContent = safeBase64Decode(fileData.content);
                
                let json;
                try {
                    json = JSON.parse(currentContent);
                } catch (parseErr) {
                    throw new Error('Το αρχείο JSON είναι κατεστραμμένο ή έχει λάθος κωδικοποίηση. Σφάλμα: ' + parseErr.message);
                }

                // 2. Προσθήκη νέας ενημέρωσης
                const newUpdate = {
                    date: `${date}T${time}:00`,
                    displayDate: formatDate(date, time),
                    content: content
                };

                // Προσθήκη στην αρχή του πίνακα
                if (!json.updates) json.updates = [];
                json.updates.unshift(newUpdate);

                // 3. Κωδικοποίηση για Commit
                // Χρησιμοποιούμε JSON.stringify με UTF-8 και μετά safeBase64Encode
                const jsonString = JSON.stringify(json, null, 2);
                const newContentBase64 = safeBase64Encode(jsonString);

                // 4. Commit
                const commitUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/updates.json`;
                const commitRes = await fetch(commitUrl, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Auto-commit: Νέα ενημέρωση - ${date}`,
                        content: newContentBase64,
                        branch: BRANCH,
                        sha: fileData.sha
                    })
                });

                if (!commitRes.ok) {
                    const err = await commitRes.json();
                    throw new Error(err.message || 'Σφάλμα commit');
                }

                // Επιτυχία
                statusDiv.textContent = '✅ Επιτυχία! Η ενημέρωση αποθηκεύτηκε.';
                statusDiv.className = 'success';
                statusDiv.style.display = 'block';
                
                contentInput.value = '';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Αποστολή & Auto Commit';

            } catch (error) {
                console.error(error);
                statusDiv.textContent = `❌ Σφάλμα: ${error.message}`;
                statusDiv.className = 'error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Αποστολή & Auto Commit';
            }
        });
    </script>
</body>
</html>
