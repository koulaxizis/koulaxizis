<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Ενημερώσεων - Χρήστος Κουλαξίζης</title>
    <style>
        /* ========================================
           Base Styles
           ======================================== */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f4f4f9; 
            padding: 2rem; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        h1 { 
            color: #333; 
            text-align: center; 
            margin-bottom: 1rem; 
        }
        .subtitle { 
            text-align: center; 
            color: #666; 
            font-size: 0.9rem; 
            margin-bottom: 2rem; 
        }
        
        .form-group { 
            margin-bottom: 1.5rem; 
        }
        .content-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.5rem; 
            gap: 10px; 
        }
        .content-header label { 
            margin-bottom: 0; 
            font-weight: bold; 
            color: #555; 
            flex: 1; 
        }
        
        /* Μετρητής */
        .char-counter { 
            font-size: 0.85rem; 
            color: #28a745; 
            font-weight: bold; 
            transition: color 0.3s; 
            white-space: nowrap; 
            margin-left: auto; 
        }
        .char-counter.warning { 
            color: #ffc107; 
        }
        .char-counter.danger { 
            color: #dc3545; 
        }

        input, textarea { 
            width: 100%; 
            padding: 0.8rem; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 1rem; 
            box-sizing: border-box; 
            font-family: inherit; 
        }
        input:focus, textarea:focus { 
            border-color: #bb86fc; 
            outline: 3px solid #bb86fc; /* Focus state */
            outline-offset: 2px;
        }
        textarea { 
            height: 120px; 
            resize: vertical; 
        }
        
        /* Κουμπιά - Desktop */
        .admin-form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .admin-form-buttons button {
            flex: 1;
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submitBtn {
            background-color: #4CAF50;
            color: white;
        }

        #clearBtn {
            background-color: #f44336;
            color: white;
        }

        #submitBtn:hover {
            background-color: #45a049;
        }

        #clearBtn:hover {
            background-color: #da190b;
        }

        /* Focus state για κουμπιά */
        button:focus {
            outline: 3px solid #bb86fc;
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(187, 134, 252, 0.3);
        }

        button:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }

        /* Status & Info */
        #status { 
            margin-top: 1.5rem; 
            padding: 1rem; 
            border-radius: 6px; 
            display: none; 
            text-align: center; 
            font-weight: bold; 
        }
        .success { 
            background: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }
        .error { 
            background: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }
        .info-box { 
            background: #e7f3ff; 
            border: 1px solid #b6d4fe; 
            color: #084298; 
            padding: 1rem; 
            border-radius: 6px; 
            margin-bottom: 1.5rem; 
            font-size: 0.9rem; 
        }
        .hint { 
            font-size: 0.85rem; 
            color: #777; 
            margin-top: 0.2rem; 
        }
        .readonly-input { 
            background-color: #e9ecef; 
            cursor: not-allowed; 
            color: #495057; 
            border-color: #ced4da; 
        }
        
        /* ========================================
           Mobile Optimization for Admin Panel
           ======================================== */

        /* Για οθόνες μικρότερες από 480px */
        @media (max-width: 480px) {
            /* Stack buttons vertically */
            .admin-form-buttons {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }
            
            .admin-form-buttons button {
                width: 100%;
                padding: 14px 20px;
                font-size: 16px;
                min-height: 48px;
            }
            
            /* Βελτίωση content-header για mobile - Μένει row */
            .content-header {
                flex-direction: row; 
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
            }
            
            /* Βελτίωση μετρητή χαρακτήρων */
            .char-counter {
                font-size: 14px;
                padding: 4px 8px;
                margin-bottom: 0;
                width: auto;
                box-sizing: border-box;
                margin-left: auto; 
            }
            
            /* Βελτίωση textarea για mobile */
            textarea {
                font-size: 16px;
                padding: 12px;
                min-height: 150px;
                width: 100%;
                margin-top: 4px;
            }
            
            /* Βελτίωση input fields */
            input[type="text"],
            input[type="url"] {
                font-size: 16px;
                padding: 12px;
                width: 100%;
                box-sizing: border-box;
            }
            
            /* Μείωση padding στο container */
            body {
                padding: 15px;
            }
            
            h1 {
                font-size: 20px;
                margin-bottom: 20px;
            }
            
            .form-group {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1 id="form-title">📝 Νέα Ενημέρωση</h1>
    <div class="subtitle">Αυτόματο Commit στο GitHub</div>

    <!-- Πληροφορίες Τελευταίας Ενημέρωσης (Last Commit Info) -->
    <div id="lastCommitInfo" class="info-box" style="display: none;" aria-live="polite">
        <strong>Τελευταία ενημέρωση:</strong> <span id="lastDate">-</span><br>
        <em id="lastContent" style="display: block; margin-top: 0.5rem; font-style: italic;">-</em>
    </div>

    <!-- Ημερομηνία -->
    <div class="form-group">
        <label for="date">Ημερομηνία (Αυτόματη)</label>
        <input type="text" id="date" class="readonly-input" readonly 
               aria-label="Ημερομηνία (Αυτόματη)" 
               aria-describedby="date-hint">
        <div id="date-hint" class="hint">Η ημερομηνία καταχωρείται αυτόματα ως σήμερα.</div>
    </div>

    <!-- Ώρα -->
    <div class="form-group">
        <label for="time">Ώρα (Αυτόματη)</label>
        <input type="text" id="time" class="readonly-input" readonly 
               aria-label="Ώρα (Αυτόματη)" 
               aria-describedby="time-hint">
        <div id="time-hint" class="hint">Η ώρα καταχωρείται αυτόματα από το σύστημα (24ωρη μορφή).</div>
    </div>

    <!-- Περιεχόμενο -->
    <div class="form-group">
        <div class="content-header">
            <label for="content">Περιεχόμενο</label>
            <div id="charCounter" class="char-counter" aria-live="polite">0/300</div>
        </div>
        <textarea id="content" placeholder="Γράψε την ενημέρωσή σου εδώ (μπορείς να βάλεις και URLs)..." required 
                  aria-label="Περιεχόμενο ενημέρωσης" 
                  aria-describedby="content-hint"></textarea>
        <div id="content-hint" class="hint">Προτεινόμενο μέγεθος: ~300 χαρακτήρες. Μπορείς να γράψεις περισσότερα.</div>
    </div>

    <!-- Κουμπιά -->
    <div class="admin-form-buttons">
        <button type="submit" id="submitBtn" aria-label="Αποστολή ενημέρωσης">📤 Αποστολή</button>
        <button type="button" id="clearBtn" aria-label="Καθαρισμός φόρμας">🗑️ Καθαρισμός</button>
    </div>

    <!-- Status Div με Role Alert -->
    <div id="status" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script>
        // --- 1. ΡΥΘΜΙΣΕΙΣ ---
        const GITHUB_USER = 'koulaxizis';
        const REPO_NAME = 'koulaxizis';
        const TOKEN = 'ghp_...';        // Δοκιμαστικό token
        const BRANCH = 'main';

        // --- 2. ΣΤΟΙΧΕΙΑ DOM ---
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusDiv = document.getElementById('status');
        const dateInput = document.getElementById('date');
        const timeInput = document.getElementById('time');
        const contentInput = document.getElementById('content');
        const charCounter = document.getElementById('charCounter');
        const lastCommitInfo = document.getElementById('lastCommitInfo');
        const lastDateSpan = document.getElementById('lastDate');
        const lastContentSpan = document.getElementById('lastContent');

        // --- 3. Αυτόματη Ημερομηνία & Ώρα ---
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        dateInput.value = `${day}/${month}/${year}`;

        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeInput.value = `${hours}:${minutes}`;

        // --- 4. Λειτουργία Μετρητή Χαρακτήρων ---
        function updateCharCounter() {
            const currentLength = contentInput.value.length;
            const limit = 300;
            charCounter.textContent = `${currentLength}/${limit}`;
            charCounter.classList.remove('warning', 'danger');
            if (currentLength > limit) charCounter.classList.add('danger');
            else if (currentLength > limit * 0.8) charCounter.classList.add('warning');
        }

        // --- 5. Draft Save (Αυτόματη Αποθήκευση) ---
        contentInput.addEventListener('input', () => {
            localStorage.setItem('draft_content', contentInput.value);
            updateCharCounter();
        });

        // Επαναφορά Draft κατά την εκκίνηση
        const savedDraft = localStorage.getItem('draft_content');
        if (savedDraft) {
            contentInput.value = savedDraft;
            updateCharCounter();
        }

        // --- 6. Λειτουργία Καθαρισμού (Clear) ---
        clearBtn.addEventListener('click', () => {
            if (confirm('Είσαι σίγουρος/η ότι θέλεις να καθαρίσεις τη φόρμα;')) {
                contentInput.value = '';
                localStorage.removeItem('draft_content');
                updateCharCounter();
                statusDiv.style.display = 'none';
                statusDiv.textContent = '';
            }
        });

        // --- 7. Βοηθητική συνάρτηση για το displayDate ---
        function formatDate(dateStr, timeStr) {
            const [d, m, y] = dateStr.split('/');
            const months = ['Ιανουαρίου', 'Φεβρουαρίου', 'Μαρτίου', 'Απριλίου', 'Μαΐου', 'Ιουνίου', 'Ιουλίου', 'Αυγούστου', 'Σεπτεμβρίου', 'Οκτωβρίου', 'Νοεμβρίου', 'Δεκεμβρίου'];
            return `${d} ${months[parseInt(m)-1]} ${y}, ${timeStr}`;
        }

        // --- 8. ΒΟΗΘΗΤΙΚΕΣ ΣΥΝΑΡΤΗΣΕΙΣ ΓΙΑ UNICODE ---
        function safeBase64Encode(str) { return btoa(unescape(encodeURIComponent(str))); }
        function safeBase64Decode(str) { return decodeURIComponent(escape(atob(str))); }

        // --- 9. Φόρτωση Πληροφοριών Τελευταίας Ενημέρωσης ---
        async function loadLastCommitInfo() {
            try {
                const fileUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/updates.json?ref=${BRANCH}`;
                const res = await fetch(fileUrl, { headers: { Authorization: `token ${TOKEN}` } });
                if (!res.ok) return;
                
                const data = await res.json();
                const json = JSON.parse(safeBase64Decode(data.content));
                
                if (json.updates && json.updates.length > 0) {
                    const last = json.updates[0];
                    const dateObj = new Date(last.date);
                    const dateStr = dateObj.toLocaleDateString('el-GR');
                    const timeStr = dateObj.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
                    
                    lastDateSpan.textContent = `${dateStr} ${timeStr}`;
                    lastContentSpan.textContent = `"${last.content.substring(0, 100)}${last.content.length > 100 ? '...' : ''}"`;
                    lastCommitInfo.style.display = 'block';
                }
            } catch (e) {
                console.log("Δεν μπόρεσε να φορτωθεί η πληροφορία τελευταίας ενημέρωσης.");
            }
        }

        // --- 10. Λειτουργία Κουμπιού Αποστολής ---
        submitBtn.addEventListener('click', async () => {
            const dateDisplay = dateInput.value;
            const time = timeInput.value.trim();
            const content = contentInput.value.trim();

            if (!dateDisplay || !time || !content) {
                alert('Παρακαλώ συμπλήρωσε όλα τα πεδία!');
                return;
            }

            submitBtn.disabled = true;
            clearBtn.disabled = true;
            submitBtn.textContent = 'Αποστολή...';
            statusDiv.style.display = 'none';
            statusDiv.textContent = '';

            try {
                const [d, m, y] = dateDisplay.split('/');
                const isoDate = `${y}-${m}-${d}T${time}:00`;

                // 1. Λήψη JSON
                const fileUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/updates.json?ref=${BRANCH}`;
                const fileRes = await fetch(fileUrl, { headers: { Authorization: `token ${TOKEN}` } });
                if (!fileRes.ok) throw new Error((await fileRes.json()).message || 'Δεν βρέθηκε το αρχείο.');
                
                const fileData = await fileRes.json();
                const currentContent = safeBase64Decode(fileData.content);
                let json = JSON.parse(currentContent);

                // 2. Προσθήκη νέας
                const newUpdate = {
                    date: isoDate,
                    displayDate: formatDate(dateDisplay, time),
                    content: content
                };
                if (!json.updates) json.updates = [];
                json.updates.unshift(newUpdate);

                // 3. Commit
                const newContentBase64 = safeBase64Encode(JSON.stringify(json, null, 2));
                const commitUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/updates.json`;
                const commitRes = await fetch(commitUrl, {
                    method: 'PUT',
                    headers: { Authorization: `token ${TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Auto-commit: Νέα ενημέρωση - ${dateDisplay}`,
                        content: newContentBase64,
                        branch: BRANCH,
                        sha: fileData.sha
                    })
                });

                if (!commitRes.ok) throw new Error((await commitRes.json()).message || 'Σφάλμα commit');

                // Επιτυχία
                statusDiv.textContent = '✅ Επιτυχία! Η ενημέρωση αποθηκεύτηκε.';
                statusDiv.className = 'success';
                statusDiv.style.display = 'block';
                
                // Καθαρισμός
                contentInput.value = '';
                localStorage.removeItem('draft_content');
                updateCharCounter();
                submitBtn.disabled = false;
                clearBtn.disabled = false;
                submitBtn.textContent = 'Αποστολή & Auto Commit';

                // Επαναφόρτωση info
                loadLastCommitInfo();

            } catch (error) {
                console.error(error);
                statusDiv.textContent = `❌ Σφάλμα: ${error.message}`;
                statusDiv.className = 'error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                clearBtn.disabled = false;
                submitBtn.textContent = 'Αποστολή & Auto Commit';
            }
        });

        // Εκκίνηση: Φόρτωση info και draft
        loadLastCommitInfo();
        updateCharCounter();
    </script>
</body>
</html>
