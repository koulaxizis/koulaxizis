<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Ενημερώσεων - Χρήστος Κουλαξίζης</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 2rem; max-width: 600px; margin: 0 auto; }
        h1 { color: #333; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box; font-family: inherit; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 1rem; background: #bb86fc; color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: background 0.3s; margin-top: 1rem; }
        button:hover { background: #9965f4; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hint { font-size: 0.85rem; color: #777; margin-top: 0.2rem; }
    </style>
</head>
<body>
    <h1>📝 Νέα Ενημέρωση</h1>
    
    <div class="form-group">
        <label for="date">Ημερομηνία</label>
        <input type="date" id="date" required>
    </div>

    <div class="form-group">
        <label for="time">Ώρα (24ωρη)</label>
        <!-- step="60" αναγκάζει το browser να χρησιμοποιήσει 24ωρη μορφή HH:MM -->
        <input type="time" id="time" step="60" required>
        <div class="hint">Μορφή: ΩΡΑ:ΛΕΠΤΟ (π.χ. 14:30)</div>
    </div>

    <div class="form-group">
        <label for="content">Περιεχόμενο</label>
        <textarea id="content" placeholder="Γράψε την ενημέρωσή σου εδώ (μπορείς να βάλεις και URLs)..." required></textarea>
    </div>

    <button id="submitBtn">Αποστολή & Auto Commit</button>
    <div id="status"></div>

        const now = new Date();
