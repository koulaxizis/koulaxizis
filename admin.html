<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Ενημερώσεων - Χρήστος Κουλαξίζης</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65a.488.488 0 00-.49-.42h-4c-.25 0-.46.17-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 00-.61.22l-2 3.46a.5.5 0 00.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 00-.12.64l2 3.46a.5.5 0 00.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.25.24.42.49.42h4c.25 0 .46-.17.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1a.5.5 0 00.61-.22l2-3.46a.5.5 0 00-.12-.64l-2.11-1.65zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z' fill='%23bb86fc'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <!-- PicMo CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/picmo@5.8.5/dist/index.css">
    <!-- Custom PicMo theme overrides -->
    <link rel="stylesheet" href="assets/emoji/picker.css">
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1>📝 Νέα Ενημέρωση</h1>
        <a href="https://koulaxizis.gr" style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; background: #bb86fc; color: #121212; border-radius: 6px; text-decoration: none; font-weight: 600; transition: opacity 0.2s; font-size: 0.9rem;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
            <i class="fa-solid fa-arrow-left"></i> Αρχική
        </a>
    </div>

    <!-- Token Section -->
    <div class="token-section">
        <button type="button" class="toggle-btn" id="tokenToggle">🔐 GitHub Token</button>
        <div class="toggle-wrapper" id="tokenWrapper">
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxx...">
            <div id="tokenStatus"></div>
        </div>
    </div>

    <!-- Main Form Start -->
    <div class="form-group">
        <div class="date-time-row">
            <div class="field">
                <label>Ημερομηνία</label>
                <input type="text" id="date" readonly>
            </div>
            <div class="field">
                <label>Ώρα</label>
                <input type="text" id="time" readonly>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="content-header">
            <label for="content">Κείμενο</label>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <label style="margin: 0; cursor: pointer; font-size: 0.85rem; color: #a0a0a0; display: flex; align-items: center; gap: 0.3rem;">
                    <input type="checkbox" id="enableLimitToggle" checked style="margin: 0;">
                    <span style="font-weight: 600;">Όριο:</span>
                    <input type="number" id="userLimitInput" value="280" min="50" max="1000"
                           style="width: 55px; padding: 3px 6px; text-align: center; font-size: 0.85rem; background: #1e1e1e; border: 1px solid #444; border-radius: 4px; color: #e0e0e0;"
                           onwheel="event.preventDefault()" step="1">
                </label>
                <div id="charCounter" class="char-counter" style="font-size: 0.85rem; font-weight: bold; transition: color 0.3s ease;">0</div>
            </div>
        </div>
        <textarea id="content" placeholder="Γράψε εδώ..." rows="5"></textarea>

        <!-- Tags Container -->
        <div class="tags-row">
            <div class="tags-container" id="tagsContainer"></div>
        </div>

        <!-- Special Characters Dropdown -->
        <div class="dropdown-container" style="margin-top: 1rem;">
            <button type="button" class="dropdown-toggle" id="specialCharsBtn">
                <span>† Ειδικοί Χαρακτήρες</span>
                <span>▼</span>
            </button>
            <div id="specialCharsDropdown" class="dropdown-menu">
                <div class="special-chars-panel">
                    <button type="button" class="special-char-btn" data-char="«">«</button>
                    <button type="button" class="special-char-btn" data-char="»">»</button>
                    <button type="button" class="special-char-btn" data-char="•">•</button>
                    <button type="button" class="special-char-btn" data-char="–">–</button>
                    <button type="button" class="special-char-btn" data-char="—">—</button>
                    <button type="button" class="special-char-btn" data-char="…">…</button>
                    <button type="button" class="special-char-btn" data-char="€">€</button>
                    <button type="button" class="special-char-btn" data-char="£">£</button>
                    <button type="button" class="special-char-btn" data-char="©">©</button>
                    <button type="button" class="special-char-btn" data-char="®">®</button>
                    <button type="button" class="special-char-btn" data-char="™">™</button>
                    <button type="button" class="special-char-btn" data-char="°">°</button>
                    <button type="button" class="special-char-btn" data-char="±">±</button>
                    <button type="button" class="special-char-btn" data-char="÷">÷</button>
                    <button type="button" class="special-char-btn" data-char="×">×</button>
                    <button type="button" class="special-char-btn" data-char="√">√</button>
                    <button type="button" class="special-char-btn" data-char="≠">≠</button>
                    <button type="button" class="special-char-btn" data-char="≤">≤</button>
                    <button type="button" class="special-char-btn" data-char="≥">≥</button>
                </div>
            </div>
        </div>

        <!-- PicMo Emoji Picker Trigger -->
        <div class="dropdown-container" style="margin-top: 1rem;">
            <button type="button" class="dropdown-toggle" id="emojiTriggerBtn">
                <span>😊 Επιλογή Emoji Tags</span>
                <span>▼</span>
            </button>
            <div id="emojiPickerContainer"></div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button type="button" id="submitBtn">📤 Αποστολή</button>
        <button type="button" id="clearBtn">🗑️ Καθαρισμός</button>
    </div>

    <!-- Status Messages -->
    <div id="status" role="alert"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/picmo@5.8.5/dist/umd/index.js"></script>
    <script src="app.js"></script>
</body>
</html>
