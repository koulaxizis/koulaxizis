<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Χρήστος Κουλαξίζης | Αναβάθμιση Ιστοσελίδας</title>
    <meta name="description" content="Η ιστοσελίδα του Χρήστου Κουλαξίζη αναβαθμίζεται. Επιστρέφουμε σύντομα.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-text: #a0a0a0;
            --border-color: #333333;
            --card-bg: #1e1e1e;
            --shadow-color: rgba(0,0,0,0.5);
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #6200ee;
            --secondary-text: #666666;
            --border-color: #e0e0e0;
            --card-bg: #f5f5f5;
            --shadow-color: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Ubuntu Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--card-bg);
            border-color: var(--accent-color);
        }

        .container {
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            display: block;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            color: var(--secondary-text);
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--accent-color);
            margin: 2rem auto;
            border: none;
            opacity: 0.7;
        }

        .contact-link {
            color: var(--accent-color);
            text-decoration: none;
            transition: opacity 0.3s ease;
            font-weight: 700;
        }

        .contact-link:hover {
            opacity: 0.7;
        }

        .name {
            color: var(--text-color);
            font-weight: 700;
        }

        @media (prefers-reduced-motion: reduce) {
            .icon { animation: none; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .icon { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Εναλλαγή σκούρου/ανοιχτού θέματος">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>

    <div class="container">
        <span class="icon" aria-hidden="true">🔧</span>
        <h1>Αναβάθμιση Ιστοσελίδας</h1>
        <p>Επιστρέφουμε σύντομα με κάτι καλύτερο.</p>
        <hr class="divider">
        <p>Επικοινωνία: <a href="mailto:koulaxizis@glarolykoi.net" class="contact-link">koulaxizis@glarolykoi.net</a></p>
        <p style="margin-top: 2rem; font-size: 0.85rem;"><span class="name">Χρήστος Κουλαξίζης</span></p>
    </div>

    <script>
        // Theme toggle
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                body.classList.add('light-mode');
                toggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
            toggle.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                const isLight = body.classList.contains('light-mode');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                toggle.innerHTML = isLight
                    ? '<i class="fa-solid fa-sun"></i>'
                    : '<i class="fa-solid fa-moon"></i>';
            });
        })();
    </script>
</body>
</html>
