<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Σελίδα δεν βρέθηκε | Χρήστος Κουλαξίζης</title>
    <meta name="description" content="Η σελίδα που αναζητάτε δεν υπάρχει. Επιστρέψτε στην κύρια σελίδα ή δείτε την τελευταία ενημέρωση.">
    <!-- Icon: Error Magnifying Glass -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-text: #a0a0a0;
            --border-color: #333333;
            --card-bg: #1e1e1e;
            --shadow-color: rgba(0,0,0,0.5);
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #6200ee;
            --secondary-text: #666666;
            --border-color: #e0e0e0;
            --card-bg: #f5f5f5;
            --shadow-color: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Ubuntu Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--card-bg);
            border-color: var(--accent-color);
        }

        .container {
            text-align: center;
            max-width: 540px;
            width: 100%;
        }

        /* Error Code Animation */
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            animation: flicker 3s ease-in-out infinite;
            line-height: 1;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
            52% { opacity: 1; }
            54% { opacity: 0.6; }
            56% { opacity: 1; }
        }

        /* Avatar Styling */
        .avatar-wrapper {
            margin: 1rem auto 1.5rem;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 3px solid var(--accent-color);
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: transform 0.3s ease;
        }

        .avatar-wrapper:hover {
            transform: scale(1.05);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent-color);
            background-color: var(--card-bg);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p.intro {
            color: var(--secondary-text);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 2px;
            background: var(--accent-color);
            margin: 1.5rem auto;
            border: none;
            opacity: 0.7;
        }

        /* Latest Update Card */
        .latest-update {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: left;
            box-shadow: 0 2px 5px var(--shadow-color);
            transition: transform 0.3s ease;
        }

        .latest-update:hover {
            transform: translateY(-2px);
        }

        .update-label {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .update-date {
            font-size: 0.8rem;
            color: var(--secondary-text);
            margin-bottom: 0.5rem;
        }

        .update-content {
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .loading .update-content::after {
            content: ' Φόρτωση...';
            color: var(--accent-color);
        }

        .error-msg {
            font-size: 0.8rem;
            color: var(--secondary-text);
            font-style: italic;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background-color: var(--accent-color);
            color: var(--bg-color);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background-color: var(--bg-color);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .btn-rss {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background-color: transparent;
            color: var(--accent-color);
            text-decoration: none;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-rss:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .signature {
            color: var(--text-color);
            font-weight: 700;
            margin-top: 2.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (prefers-reduced-motion: reduce) {
            .error-code { animation: none; }
            .avatar-wrapper { transition: none; }
            .latest-update, .btn-home, .btn-rss { transform: none !important; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .error-code { font-size: 4rem; }
            .avatar-wrapper { width: 80px; height: 80px; }
            .avatar-fallback { font-size: 2rem; }
            .latest-update { padding: 1rem; }
            .action-buttons { flex-direction: column; }
            .btn-home, .btn-rss { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Εναλλαγή σκούρου/ανοιχτού θέματος">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>

    <div class="container">
        <!-- Error Code -->
        <span class="error-code" aria-hidden="true">404</span>
        
        <!-- Avatar Section -->
        <div class="avatar-wrapper">
            <!-- Αντικατέστησε το src με τη διαδρομή του avatar σου -->
            <img src="avatar.jpg" alt="Χρήστος Κουλαξίζης" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="avatar-fallback" style="display:none;">ΚΚ</div>
        </div>

        <h1>Δεν Βρέθηκε</h1>
        <p class="intro">Λυπάμαι, αλλά αυτή η σελίδα δεν υπάρχει. Ίσως μεταφέρθηκε.</p>
        
        <hr class="divider">
        
        <!-- Latest Update Section -->
        <div class="latest-update loading" id="latestUpdate">
            <span class="update-label">Τελευταία Ενημέρωση</span>
            <div class="update-date" id="updateDate"></div>
            <div class="update-content" id="updateContent"></div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="/" class="btn-home">
                <span>←</span> Κύρια Σελίδα
            </a>
            <a href="/feed.xml" target="_blank" class="btn-rss">
                <span>📡</span> RSS Feed
            </a>
        </div>
        
        <p class="signature">Χρήστος Κουλαξίζης</p>
    </div>

    <script>
        // ==============================================
        // Theme Toggle Logic
        // ==============================================
        (function() {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            const saved = localStorage.getItem('theme');
            
            if (saved === 'light') {
                body.classList.add('light-mode');
                toggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
            
            toggle.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                const isLight = body.classList.contains('light-mode');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                toggle.innerHTML = isLight
                    ? '<i class="fa-solid fa-sun"></i>'
                    : '<i class="fa-solid fa-moon"></i>';
            });
        })();

        // ==============================================
        // Fetch Latest Update from RSS
        // ==============================================
        async function loadLatestUpdate() {
            const updateContainer = document.getElementById('latestUpdate');
            const dateEl = document.getElementById('updateDate');
            const contentEl = document.getElementById('updateContent');
            
            try {
                // Fetch RSS feed
                const response = await fetch('/feed.xml');
                
                if (!response.ok) throw new Error('Feed not available');
                
                const text = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, 'text/xml');
                const items = xmlDoc.querySelectorAll('item');
                
                if (items.length > 0) {
                    const firstItem = items[0];
                    
                    // Extract title, date, description
                    const pubDate = firstItem.querySelector('pubDate')?.textContent || '';
                    const description = firstItem.querySelector('description')?.textContent || '';
                    
                    // Format date for display
                    const dateObj = new Date(pubDate);
                    const formattedDate = dateObj.toLocaleDateString('el-GR', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    // Clean description (remove HTML tags & limit length)
                    const cleanDescription = description.replace(/<[^>]*>/g, '').substring(0, 160);
                    
                    // Display in container
                    dateEl.textContent = formattedDate;
                    contentEl.textContent = cleanDescription + (cleanDescription.length >= 160 ? '...' : '');
                    
                    updateContainer.classList.remove('loading');
                } else {
                    throw new Error('No items found');
                }
            } catch (error) {
                console.log('[404 Page] Failed to load latest update:', error);
                dateEl.textContent = '';
                contentEl.innerHTML = '<span class="error-msg">Αδυναμία φόρτωσης της τελευταίας ενημέρωσης.</span>';
                updateContainer.classList.remove('loading');
            }
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadLatestUpdate);
        
        // Log for debugging
        console.log('[404 Page] Accessed via:', window.location.href);
    </script>
</body>
</html>
