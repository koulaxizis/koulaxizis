<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>404 - Η σελίδα δεν βρέθηκε</title>
    
    <!-- Preload Critical Assets -->
    <link rel="preload" href="style.css" as="style">
    <link rel="stylesheet" href="style.css">
    
    <!-- Simple Error Styling (Inline for Speed) -->
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
        .error-code { font-size: 6rem; color: var(--accent-color); margin: 0; line-height: 1; }
        .error-msg { font-size: 1.5rem; color: var(--text-color); margin: 1rem 0; }
        .error-desc { color: var(--secondary-text); max-width: 500px; margin-bottom: 2rem; }
        .btn-home { background: var(--accent-color); color: var(--bg-color); padding: 0.8rem 1.5rem; border-radius: 50px; text-decoration: none; font-weight: bold; transition: transform 0.2s; display: inline-block; }
        .btn-home:hover { transform: scale(1.05); opacity: 0.9; }
        
        /* Latest Update Box */
        .latest-update-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: var(--border-radius); margin-top: 2rem; max-width: 600px; width: 100%; box-shadow: 0 4px 10px var(--shadow-color); }
        .latest-update-box h3 { color: var(--accent-color); margin-top: 0; }
        .loading-msg { font-style: italic; color: var(--secondary-text); }
    </style>
</head>
<body>
    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Πήγαινε στο περιεχόμενο</a>

    <main id="main-content">
        <h1 class="error-code">404</h1>
        <p class="error-msg">Ουψ! Η σελίδα που ψάχνεις έχει φύγει.</p>
        <p class="error-desc">Ίσως μεταφέρθηκε ή διαγράφηκε. Μην απογοητευτείς! Δες τι νέο έχουν δημοσιεύσει οι εκδόσεις μας πρόσφατα:</p>
        
        <a href="/" class="btn-home">Επιστροφή στην Κύρια Σελίδα</a>

        <!-- Dynamic Latest Update Section -->
        <div id="latestUpdate" class="latest-update-box loading">
            <div class="loading-msg">Φόρτωση τελευταίας ενημέρωσης...</div>
        </div>
    </main>

    <!-- External Script for Dynamic Content -->
    <script src="script.js"></script>

    <!-- Inline Logic to Fetch Latest Update -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('latestUpdate');
            if (!container) return;

            try {
                // Fetch updates.json with cache busting
                const response = await fetch('updates.json?t=' + new Date().getTime(), { cache: 'no-cache' });
                if (!response.ok) throw new Error('No data');
                
                const data = await response.json();
                const updates = data.updates || [];
                
                if (updates.length > 0) {
                    // Get the first (most recent) update
                    const latest = updates[0];
                    const dateObj = new Date(latest.date);
                    const formattedDate = dateObj.toLocaleDateString('el-GR', { 
                        year: 'numeric', month: 'long', day: 'numeric' 
                    });
                    
                    // Truncate content if too long
                    let contentText = latest.content.trim();
                    if (contentText.length > 180) {
                        contentText = contentText.substring(0, 177) + '...';
                    }

                    container.innerHTML = `
                        <h3><i class="fa-solid fa-newspaper"></i> Τελευταία Ενημέρωση</h3>
                        <time datetime="${latest.date}" style="color: var(--secondary-text); font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">${formattedDate}</time>
                        <p style="margin: 0; color: var(--text-color);">${contentText}</p>
                        <a href="${location.protocol}//${location.host}/#articles" style="display: block; margin-top: 1rem; color: var(--accent-color); text-decoration: none; font-size: 0.9rem;">Δείτε όλες τις ενημερώσεις →</a>
                    `;
                } else {
                    container.innerHTML = '<p style="color: var(--secondary-text);">Δεν υπάρχουν διαθέσιμες ενημερώσεις αυτή τη στιγμή.</p>';
                }
            } catch (error) {
                console.error('Error fetching latest update:', error);
                container.innerHTML = '<p style="color: var(--secondary-text);">Δεν ήταν δυνατόν να φορτωθούν οι τελευταίες ειδήσεις.</p>';
            }
            
            // Remove loading class
            container.classList.remove('loading');
        });
    </script>
</body>
</html>
