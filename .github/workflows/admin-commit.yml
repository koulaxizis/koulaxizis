name: Admin Commit Handler

on:
  repository_dispatch:
    types: [admin-update]

jobs:
  commit-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Parse and Update JSON
        id: update
        run: |
          # Δημιουργία νέου JSON με τα δεδομένα από το payload
          echo "${{ github.event.client_payload }}" > payload.json
          
          # Χρήση jq για να προσθέσουμε το update στο updates.json
          # (Πρέπει να εγκαταστήσεις jq ή να το κάνεις με python/node)
          # Εδώ θα κάνουμε απλή προσθήκη με Python για ευκολία
          python3 << EOF
          import json
          import sys

          # Φόρτωση payload
          with open('payload.json', 'r') as f:
              payload = json.load(f)

          # Φόρτωση updates.json
          try:
              with open('updates.json', 'r') as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {"updates": []}

          # Δημιουργία νέου update
          new_update = {
              "date": payload["date"],
              "displayDate": payload["displayDate"],
              "content": payload["content"],
              "publishTo": payload["publishTo"]
          }

          # Προσθήκη στην αρχή
          data["updates"].insert(0, new_update)

          # Αποθήκευση
          with open('updates.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("Updated successfully")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add updates.json
          git commit -m "Auto-commit: Νέα ενημέρωση από Admin Panel"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_COMMIT_TOKEN }}