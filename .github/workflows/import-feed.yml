name: Import External Feed

# Φέρνει αναρτήσεις από το feed του sources.json (π.χ. Ko-fi) μέσα στο updates.json.
# Όταν το sources.json έχει "mode": "manual", τρέχει μόνο το σύντομο job "mode" και η εισαγωγή παραλείπεται.
on:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'sources.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updates-json
  cancel-in-progress: false

jobs:
  # Διαβάζει μόνο το mode του sources.json, ώστε σε "manual" η εισαγωγή να παραλείπεται
  # χωρίς να στήνεται Node και χωρίς να τρέχει το import-feed.js.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.read.outputs.mode }}
    steps:
      - name: Checkout sources.json
        uses: actions/checkout@v5
        with:
          sparse-checkout: sources.json
          sparse-checkout-cone-mode: false

      - name: Read mode
        id: read
        run: echo "mode=$(node -p "require('./sources.json').mode || 'manual'")" >> "$GITHUB_OUTPUT"

  import:
    needs: mode
    if: needs.mode.outputs.mode == 'feed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Import feed into updates.json
        run: node import-feed.js

      # Τα commits του GITHUB_TOKEN δεν ξεκινούν άλλα workflows,
      # οπότε το feed.xml ξαναφτιάχνεται εδώ αντί από το generate-rss.yml.
      - name: Regenerate RSS
        run: |
          if ! git diff --quiet -- updates.json; then node generate-rss.js; fi

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add updates.json feed.xml .github/feed-state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Auto: import external feed [skip ci]"
          git push || (git pull --rebase && git push)
