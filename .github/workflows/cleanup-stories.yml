name: 🧹 Cleanup Expired Stories

on:
  schedule:
    # Κάθε μέρα στις 03:00 UTC (05:00 Ελλάδα καλοκαιρινού)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Μπορείς να το τρέξεις χειροκίνητα

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Remove expired stories
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import time
          import subprocess

          STORIES_FILE = "stories.json"
          STORIES_DIR = "assets/stories"

          if not os.path.exists(STORIES_FILE):
              print("No stories.json found. Exiting.")
              exit(0)

          with open(STORIES_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          stories = data.get("stories", [])
          now_ms = int(time.time() * 1000)

          active = []
          expired_files = []

          for story in stories:
              expires = story.get("expires", 0)
              if now_ms > expires:
                  src = story.get("src", "")
                  if src.startswith("/"):
                      src = src[1:]
                  elif src.startswith("./"):
                      src = src[2:]
                  expired_files.append(src)
                  print(f"  ❌ Expired: {story.get('id')} ({src})")
              else:
                  active.append(story)

          deleted_count = 0
          for filepath in expired_files:
              if filepath and os.path.exists(filepath):
                  os.remove(filepath)
                  deleted_count += 1
                  print(f"  🗑️ Deleted: {filepath}")

          data["stories"] = active

          with open(STORIES_FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"\n📊 Summary:")
          print(f"  - Total stories before: {len(stories)}")
          print(f"  - Active: {len(active)}")
          print(f"  - Expired: {len(stories) - len(active)}")
          print(f"  - Files deleted: {deleted_count}")

          # Write summary for next step
          with open("/tmp/cleanup_summary.txt", "w") as f:
              if expired_files or len(active) != len(stories):
                  f.write("CHANGES")
              else:
                  f.write("NO_CHANGES")
          PYEOF

      - name: 💾 Commit changes
        run: |
          SUMMARY=$(cat /tmp/cleanup_summary.txt)
          if [ "$SUMMARY" = "NO_CHANGES" ]; then
            echo "No expired stories to clean. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stories.json assets/stories/
          git commit -m "🧹 Auto: Cleanup expired stories ($(date -u '+%Y-%m-%d %H:%M UTC'))" || echo "Nothing to commit"
          git push