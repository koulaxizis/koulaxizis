name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky;'
        required: true
        type: boolean
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon?'
        required: true
        type: boolean
      hashtags_convert:
        description: 'Μετατροπή emojis σε hashtags;'
        required: false
        type: boolean
        default: false

jobs:
  post-to-social:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade atproto mastodon.py requests beautifulsoup4 lxml

      - name: Load Emoji Map
        id: load_map
        run: |
          if [ -f "emoji_map.json" ]; then
            echo "✅ emoji_map.json found."
          else
            echo "❌ Error: emoji_map.json not found!"
            exit 1
          fi

      - name: Post to BlueSky (with Image Scrape)
        if: github.event.inputs.bluesky_post == 'true'
        env:
          BS_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BS_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from datetime import datetime
          from atproto import Client
          from atproto_client.models import ComAtprotoRepoStrongRefMain as StrongRef
          
          # Φόρτωση χάρτη
          try:
              with open('emoji_map.json', 'r', encoding='utf-8') as f:
                  EMOJI_MAP = json.load(f)
          except Exception as e:
              print(f"❌ Error loading map: {e}")
              exit(1)

          username = os.environ.get('BS_USERNAME', '').strip()
          password = os.environ.get('BS_PASSWORD', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '')
          convert_str = os.environ.get('CONVERT_EMOJIS', 'false')
          
          convert_emojis = str(convert_str).lower() in ['true', '1', 'yes']

          print(f"🔍 BlueSky Debug: Convert={convert_emojis}, Tags='{tags_input}'")

          if not username or not password:
              print("❌ Missing Credentials.")
              exit(1)

          # --- 1. ΕΥΡΕΣΗ URL ΓΙΑ SCRAPING ---
          # Αναζήτηση για URL στο περιεχόμενο
          url_pattern = r'(https?://[^\s]+)'
          urls_in_content = re.findall(url_pattern, content)
          
          image_url = None
          if urls_in_content:
              target_url = urls_in_content[0] # Παίρνουμε το πρώτο URL
              print(f"   🔗 Found URL for scraping: {target_url}")
              
              try:
                  # Request στη σελίδα
                  headers = {'User-Agent': 'Mozilla/5.0 (compatible; KoulaxizisBot/1.0)'}
                  response = requests.get(target_url, headers=headers, timeout=10)
                  response.raise_for_status()
                  
                  soup = BeautifulSoup(response.text, 'lxml')
                  
                  # Αναζήτηση og:image
                  og_image = soup.find('meta', property='og:image')
                  twitter_image = soup.find('meta', property='twitter:image')
                  
                  if og_image and og_image.get('content'):
                      image_url = og_image.get('content')
                  elif twitter_image and twitter_image.get('content'):
                      image_url = twitter_image.get('content')
                  
                  # Αν δεν βρέθηκε άμεσα, δοκιμάζουμε absolute path
                  if image_url and not image_url.startswith('http'):
                      image_url = urljoin(target_url, image_url)
                      
                  if image_url:
                      print(f"   🖼️ Found Image URL: {image_url}")
                  else:
                      print(f"   ⚠️ No Open Graph image found on {target_url}")
              except Exception as e:
                  print(f"   ❌ Error scraping image: {str(e)}")
                  image_url = None
          else:
              print(f"   ℹ️ No URL found in content to scrape image.")

          # --- 2. ΚΑΤΑΣΚΕΥΗ FACETS & TEXT ---
          generated_keywords = []
          if tags_input and convert_emojis:
              raw_tags = [t.strip() for t in tags_input.split() if t.strip()]
              for tag in raw_tags:
                  if tag in EMOJI_MAP:
                      generated_keywords.append(EMOJI_MAP[tag])

          final_text = content
          facets = []
          
          if generated_keywords:
              suffix = "\n\n" + " ".join([f"#{kw}" for kw in generated_keywords])
              final_text += suffix

          # Υπολογισμός byte offsets για facets (URLs και Hashtags)
          byte_text = final_text.encode('utf-8')
          
          # URLs (για clickable links στο κείμενο)
          for match in re.finditer(r'(https?://[^\s]+)', final_text):
              s = len(final_text[:match.start()].encode('utf-8'))
              e = len(final_text[:match.end()].encode('utf-8'))
              facets.append({
                  "$type": "app.bsky.richtext.facet",
                  "index": {"byteStart": s, "byteEnd": e},
                  "features": [{"$type": "app.bsky.richtext.facet#link", "uri": match.group(0)}]
              })
          
          # Hashtags
          for match in re.finditer(r'#(\w+)', final_text):
              s = len(final_text[:match.start()].encode('utf-8'))
              e = len(final_text[:match.end()].encode('utf-8'))
              tag_word = match.group(1)
              if tag_word in generated_keywords:
                  facets.append({
                      "$type": "app.bsky.richtext.facet",
                      "index": {"byteStart": s, "byteEnd": e},
                      "features": [{"$type": "app.bsky.richtext.facet#tag", "tag": tag_word}]
                  })

          # --- 3. UPLOAD IMAGE ΑΝ ΥΠΑΡΧΕΙ ---
          embed_blob = None
          if image_url:
              try:
                  print(f"   🔄 Downloading image...")
                  img_resp = requests.get(image_url, headers=headers, timeout=15)
                  img_resp.raise_for_status()
                  
                  # Έλεγχος τύπου αρχείου
                  content_type = img_resp.headers.get('Content-Type', '')
                  if not content_type.startswith('image/'):
                      print(f"   ⚠️ Link is not an image ({content_type}). Skipping.")
                      image_url = None
                  else:
                      blob_data = {
                          "blob": img_resp.content,
                          "mimeType": content_type,
                          "dimensions": {"width": 1, "height": 1} # Το BlueSky θα υπολογίσει τα διαστάσεις αργότερα αν χρειαστεί, αλλά πρέπει να περάσουμε κάτι ή το client να το φροντίσει. Στην πραγματικότητα το send_image handle αυτόματα.
                      }
                      
                      # Σε recent atproto versions, το client.send_post με image handling είναι πιο direct.
                      # Θα χρησιμοποιήσουμε το blob upload API απευθείας
                      
                      # Μέθοδος: Upload Blob
                      # Σημείωση: Η atproto library έχει συνάρτηση για upload; 
                      # Δεν υπάρχει απλή συνάρτηση. Θα πρέπει να χρησιμοποιήσουμε την API απευθείας μέσω του client session.
                      
                      print(f"   ⏳ Uploading to Bluesky...")
                      
                      # Χρήση του session του client για upload
                      # Το client.login έχει ήδη δημιουργήσει session
                      upload_resp = client._session.post(
                          "https://bsky.social/xrpc/com.atproto.repo.uploadBlob",
                          files={"blob": (os.path.basename(image_url), img_resp.content, content_type)}
                      )
                      
                      if upload_resp.status_code != 200:
                          print(f"   ❌ Failed to upload blob: {upload_resp.text}")
                          image_url = None
                      else:
                          embed_data = upload_resp.json()
                          embed_blob = {
                              "$type": "app.bsky.embed.images#view",
                              "images": [
                                  {
                                      "alt": "", # Μπορείς να προσθέσεις ALT text εδώ
                                      "image": embed_data["blob"]
                                  }
                              ]
                          }
                          print(f"   ✅ Image uploaded successfully!")
              except Exception as e:
                  print(f"   ❌ Error processing image: {str(e)}")
                  import traceback
                  traceback.print_exc()
                  image_url = None

          try:
              client = Client()
              client.login(username, password)

              # Κατασκευή του record
              record_data = {
                  "text": final_text,
                  "facets": facets,
                  "createdAt": datetime.utcnow().isoformat() + "Z"
              }
              
              # Αν υπάρχουν facets και/image
              if embed_blob:
                  record_data["embed"] = embed_blob
                  print("   📷 Posting with embedded image.")
              elif facets:
                  print("   🔗 Posting with facets only.")
              else:
                  print("   📝 Posting plain text.")

              # Send Post
              # Η συνάρτηση send_post μπορεί να δεχτεί dictionary
              reply_data = client.send_post(record_data)
              print(f"✅ Posted to BlueSky: {reply_data.uri}")
              
          except Exception as e:
              print(f"❌ Failed to post to BlueSky: {str(e)}")
              import traceback
              traceback.print_exc()
              exit(1)
          PYTHON_SCRIPT

      - name: Post to Mastodon
        if: github.event.inputs.mastodon_post == 'true'
        env:
          MA_INSTANCE: ${{ secrets.MASTODON_INSTANCE_URL || 'https://mastodon.social' }}
          MA_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import json
          from mastodon import Mastodon

          try:
              with open('emoji_map.json', 'r', encoding='utf-8') as f:
                  EMOJI_MAP = json.load(f)
          except Exception as e:
              print(f"❌ Error loading map: {e}")
              exit(1)

          instance_url = os.environ.get('MA_INSTANCE', 'https://mastodon.social').strip()
          access_token = os.environ.get('MA_TOKEN', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '')
          convert_str = os.environ.get('CONVERT_EMOJIS', 'false')
          
          convert_emojis = str(convert_str).lower() in ['true', '1', 'yes']

          if not access_token:
              print("❌ Missing Access Token.")
              exit(1)

          final_text = content
          
          if tags_input and convert_emojis:
              raw_tags = [t.strip() for t in tags_input.split() if t.strip()]
              generated_hashtags = []
              
              for tag in raw_tags:
                  if tag in EMOJI_MAP:
                      keyword = EMOJI_MAP[tag]
                      generated_hashtags.append(f"#{keyword}")

              if generated_hashtags:
                  final_text += "\n\n" + " ".join(generated_hashtags)
                  print(f"✅ Hashtags added: {generated_hashtags}")

          try:
              if not instance_url.startswith('http'):
                  instance_url = 'https://' + instance_url
              
              mastodon = Mastodon(access_token=access_token, api_base_url=instance_url)
              mastodon_status = mastodon.status_post(final_text)
              print(f"✅ Posted to Mastodon: {mastodon_status.url}")
          except Exception as e:
              print(f"❌ Failed to post to Mastodon: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Log Success
        if: always()
        run: |
          echo "Workflow finished."