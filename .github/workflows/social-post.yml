name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky;'
        required: true
        type: boolean
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon;'
        required: true
        type: boolean
      hashtags_convert:
        description: 'Μετατροπή emojis σε hashtags;'
        required: false
        type: boolean
        default: false

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install atproto mastodon.py

      - name: Post to BlueSky
        if: github.event.inputs.bluesky_post == 'true'
        env:
          BS_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BS_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import re
          from atproto import Client, client_utils

          username = os.environ.get('BS_USERNAME', '').strip()
          password = os.environ.get('BS_PASSWORD', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '').strip()
          convert_emojis = os.environ.get('CONVERT_EMOJIS', 'false').lower() == 'true'

          if not username or not password:
              print("❌ Error: BlueSky credentials missing.")
              exit(1)

          final_hashtags = ""

          if convert_emojis and tags_input:
              raw_tags = re.split(r'\s+', tags_input)
              generated = []
              for tag in raw_tags:
                  if not tag:
                      continue
                  cleaned = re.sub(r'[^\w\s]', '', tag).strip()
                  if cleaned:
                      generated.append(f"#{cleaned}")
              final_hashtags = " ".join(generated)
              print(f"DEBUG: Generated hashtags: {final_hashtags}")

          try:
              client = Client()
              client.login(username, password)

              if convert_emojis and final_hashtags:
                  full_text = f"{content}\n\n{final_hashtags}".strip()
              else:
                  full_text = content

              doc = client_utils.TextBuilder().text(full_text)
              reply_data = client.send_post(doc)
              print(f"✅ Posted to BlueSky: {reply_data.uri}")
          except Exception as e:
              print(f"❌ Failed to post to BlueSky: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Post to Mastodon
        if: github.event.inputs.mastodon_post == 'true'
        env:
          MA_INSTANCE: ${{ secrets.MASTODON_INSTANCE_URL || 'https://mastodon.social' }}
          MA_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import re
          from mastodon import Mastodon

          instance_url = os.environ.get('MA_INSTANCE', 'https://mastodon.social').strip()
          access_token = os.environ.get('MA_TOKEN', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '').strip()
          convert_emojis = os.environ.get('CONVERT_EMOJIS', 'false').lower() == 'true'

          if not access_token:
              print("❌ Error: Mastodon Access Token missing.")
              exit(1)

          final_hashtags = ""

          if convert_emojis and tags_input:
              raw_tags = re.split(r'\s+', tags_input)
              generated = []
              for tag in raw_tags:
                  if not tag:
                      continue
                  cleaned = re.sub(r'[^\w\s]', '', tag).strip()
                  if cleaned:
                      generated.append(f"#{cleaned}")
              final_hashtags = " ".join(generated)
              print(f"DEBUG: Generated hashtags: {final_hashtags}")

          try:
              if not instance_url.startswith('http'):
                  instance_url = 'https://' + instance_url

              mastodon = Mastodon(access_token=access_token, api_base_url=instance_url)

              if convert_emojis and final_hashtags:
                  full_text = f"{content}\n\n{final_hashtags}".strip()
              else:
                  full_text = content

              mastodon_status = mastodon.status_post(full_text)
              print(f"✅ Posted to Mastodon: {mastodon_status.url}")
          except Exception as e:
              print(f"❌ Failed to post to Mastodon: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Log Success
        if: always()
        run: |
          echo "Workflow execution finished."