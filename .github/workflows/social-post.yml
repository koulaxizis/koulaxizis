name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky?'
        required: true
        type: boolean
        default: true
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon?'
        required: true
        type: boolean
        default: false
      hashtags_convert:
        description: 'Μετατροπή emojis σε hashtags?'
        required: false
        type: boolean
        default: false

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade atproto mastodon.py requests beautifulsoup4 lxml

      - name: Load Emoji Map
        if: always()
        run: |
          if [ -f "emoji_map.json" ]; then
            echo "✅ emoji_map.json found."
          else
            echo "❌ Error: emoji_map.json not found!"
            exit 1
          fi

      - name: Post to BlueSky
        if: ${{ github.event.inputs.bluesky_post == 'true' }}
        env:
          BS_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BS_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
import os
import json
import re
import requests
from bs4 import BeautifulSoup
from urllib.parse import urljoin
from datetime import datetime
from atproto import Client

try:
    with open('emoji_map.json', 'r', encoding='utf-8') as f:
        EMOJI_MAP = json.load(f)
except Exception as e:
    print(f"❌ Error loading map: {e}")
    exit(1)

username = os.environ.get('BS_USERNAME', '').strip()
password = os.environ.get('BS_PASSWORD', '').strip()
content = os.environ.get('POST_CONTENT', '').strip()
tags_input = os.environ.get('TAGS_INPUT', '')
convert_str = os.environ.get('CONVERT_EMOJIS', 'false')
convert_emojis = str(convert_str).lower() in ['true', '1', 'yes']

print(f"🔍 BlueSky Debug: Convert={convert_emojis}, Tags='{tags_input}'")

if not username or not password:
    print("❌ Missing Credentials.")
    exit(1)

url_pattern = r'(https?://[^\s]+)'
urls_in_content = re.findall(url_pattern, content)
image_url = None
headers = {'User-Agent': 'Mozilla/5.0 (compatible; KoulaxizisBot/1.0)'}

if urls_in_content:
    target_url = urls_in_content[0]
    print(f"   🔗 Found URL for scraping: {target_url}")
    try:
        response = requests.get(target_url, headers=headers, timeout=10)
        response.raise_for_status()
        soup = BeautifulSoup(response.text, 'lxml')
        og_image = soup.find('meta', property='og:image')
        twitter_image = soup.find('meta', property='twitter:image')
        
        if og_image and og_image.get('content'):
            image_url = og_image.get('content')
        elif twitter_image and twitter_image.get('content'):
            image_url = twitter_image.get('content')
        
        if image_url and not image_url.startswith('http'):
            image_url = urljoin(target_url, image_url)
            
        if image_url:
            print(f"   🖼️ Found Image URL: {image_url}")
        else:
            print(f"   ⚠️ No Open Graph image found on {target_url}")
    except Exception as e:
        print(f"   ❌ Error scraping image: {str(e)}")
        image_url = None
else:
    print(f"   ℹ️ No URL found in content to scrape image.")

generated_keywords = []
if tags_input and convert_emojis:
    raw_tags = [t.strip() for t in tags_input.split() if t.strip()]
    for tag in raw_tags:
        if tag in EMOJI_MAP:
            generated_keywords.append(EMOJI_MAP[tag])

final_text = content
facets = []

if generated_keywords:
    suffix = "\n\n" + " ".join([f"#{kw}" for kw in generated_keywords])
    final_text += suffix

for match in re.finditer(r'(https?://[^\s]+)', final_text):
    s = len(final_text[:match.start()].encode('utf-8'))
    e = len(final_text[:match.end()].encode('utf-8'))
    facets.append({