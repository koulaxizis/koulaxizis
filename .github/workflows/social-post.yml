name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky;'
        required: true
        type: boolean
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon;'
        required: true
        type: boolean
      hashtags_convert:
        description: 'Μετατροπή emojis σε hashtags;'
        required: false
        type: boolean
        default: false

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install atproto mastodon.py

      - name: Post to BlueSky
        if: github.event.inputs.bluesky_post == 'true'
        env:
          BS_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BS_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import re
          from atproto import Client, client_utils

          username = os.environ.get('BS_USERNAME', '').strip()
          password = os.environ.get('BS_PASSWORD', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '') # Προσοχή: μην strip() εδώ αν θέλουμε να δούμε κενό
          convert_str = os.environ.get('CONVERT_EMOJIS', 'false')
          
          # Σωστή μετατροπή boolean από string του GitHub
          convert_emojis = str(convert_str).lower() in ['true', '1', 'yes']

          print(f"🔍 DEBUG [BlueSky]:")
          print(f"   Convert Flag: {convert_emojis} (raw: '{convert_str}')")
          print(f"   Tags Input Raw: '{tags_input}'")
          print(f"   Content: '{content}'")

          if not username or not password:
              print("❌ Error: BlueSky credentials missing.")
              exit(1)

          final_suffix = ""

          if tags_input and convert_emojis:
              # Διαχωρισμός tags (περίπτωση πολλαπλών κενών)
              raw_tags = [t.strip() for t in re.split(r'\s+', tags_input) if t.strip()]
              print(f"   Parsed Tags: {raw_tags}")
              
              generated_hashtags = []
              for tag in raw_tags:
                  # Αφαίρεση NON-WORD characters (emojis, σύμβολα)
                  # flags=re.UNICODE για να δουλεύει με ελληνικά
                  cleaned = re.sub(r'[^\w]', '', tag, flags=re.UNICODE).strip()
                  
                  if cleaned:
                      hashtag = f"#{cleaned}"
                      generated_hashtags.append(hashtag)
                      print(f"   Converted '{tag}' -> '{hashtag}'")
                  else:
                      print(f"   Skipped '{tag}' (no text found)")
              
              if generated_hashtags:
                  final_suffix = "\n\n" + " ".join(generated_hashtags)
                  print(f"   Final Suffix: '{final_suffix}'")
              else:
                  print(f"   No hashtags generated from input.")
          elif not convert_emojis:
              print(f"   Conversion disabled. No suffix added.")
          else:
              print(f"   No tags provided.")

          try:
              client = Client()
              client.login(username, password)

              full_text = f"{content}{final_suffix}".strip()

              doc = client_utils.TextBuilder().text(full_text)
              reply_data = client.send_post(doc)
              print(f"✅ Posted to BlueSky!")
              print(f"📝 FINAL CONTENT: '{full_text}'")
          except Exception as e:
              print(f"❌ Failed to post to BlueSky: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Post to Mastodon
        if: github.event.inputs.mastodon_post == 'true'
        env:
          MA_INSTANCE: ${{ secrets.MASTODON_INSTANCE_URL || 'https://mastodon.social' }}
          MA_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import re
          from mastodon import Mastodon

          instance_url = os.environ.get('MA_INSTANCE', 'https://mastodon.social').strip()
          access_token = os.environ.get('MA_TOKEN', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '')
          convert_str = os.environ.get('CONVERT_EMOJIS', 'false')
          
          convert_emojis = str(convert_str).lower() in ['true', '1', 'yes']

          print(f"🔍 DEBUG [Mastodon]:")
          print(f"   Convert Flag: {convert_emojis} (raw: '{convert_str}')")
          print(f"   Tags Input Raw: '{tags_input}'")
          print(f"   Content: '{content}'")

          if not access_token:
              print("❌ Error: Mastodon Access Token missing.")
              exit(1)

          final_suffix = ""

          if tags_input and convert_emojis:
              raw_tags = [t.strip() for t in re.split(r'\s+', tags_input) if t.strip()]
              print(f"   Parsed Tags: {raw_tags}")
              
              generated_hashtags = []
              for tag in raw_tags:
                  cleaned = re.sub(r'[^\w]', '', tag, flags=re.UNICODE).strip()
                  
                  if cleaned:
                      hashtag = f"#{cleaned}"
                      generated_hashtags.append(hashtag)
                      print(f"   Converted '{tag}' -> '{hashtag}'")
                  else:
                      print(f"   Skipped '{tag}' (no text found)")
              
              if generated_hashtags:
                  final_suffix = "\n\n" + " ".join(generated_hashtags)
                  print(f"   Final Suffix: '{final_suffix}'")
              else:
                  print(f"   No hashtags generated from input.")
          elif not convert_emojis:
              print(f"   Conversion disabled. No suffix added.")
          else:
              print(f"   No tags provided.")

          try:
              if not instance_url.startswith('http'):
                  instance_url = 'https://' + instance_url
              
              mastodon = Mastodon(access_token=access_token, api_base_url=instance_url)

              full_text = f"{content}{final_suffix}".strip()
              
              mastodon_status = mastodon.status_post(full_text)
              print(f"✅ Posted to Mastodon!")
              print(f"📝 FINAL CONTENT: '{full_text}'")
          except Exception as e:
              print(f"❌ Failed to post to Mastodon: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Log Success
        if: always()
        run: |
          echo "Workflow execution finished."