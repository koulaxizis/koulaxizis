name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky;'
        required: true
        type: boolean
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon?'
        required: true
        type: boolean

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install atproto mastodon.py
      
      - name: Post to BlueSky
        if: github.event.inputs.bluesky_post == 'true'
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          HASHTAGS: ${{ github.event.inputs.tags }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          from atproto import Client, client_utils

          username = os.getenv('BLUESKY_USERNAME')
          password = os.getenv('BLUESKY_PASSWORD')
          content = os.getenv('POST_CONTENT', '')
          hashtags = os.getenv('HASHTAGS', '')

          if not username or not password:
              print("❌ Error: BlueSky credentials (Username/Password) are missing in Secrets.")
              exit(1)

          try:
              client = Client()
              client.login(username, password)

              # Σύνδεση Hashtags στο κείμενο
              full_text = f"{content}\n\n{hashtags}".strip()

              doc = client_utils.TextBuilder().text(full_text)
              
              reply_data = client.send_post(doc)
              print(f"✅ Successfully posted to BlueSky: {reply_data.uri}")
          except Exception as e:
              print(f"❌ Failed to post to BlueSky: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Post to Mastodon
        if: github.event.inputs.mastodon_post == 'true'
        env:
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL || 'https://mastodon.social' }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          HASHTAGS: ${{ github.event.inputs.tags }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          from mastodon import Mastodon

          instance_url = os.getenv('MASTODON_INSTANCE_URL')
          access_token = os.getenv('MASTODON_ACCESS_TOKEN')
          content = os.getenv('POST_CONTENT', '')
          hashtags = os.getenv('HASHTAGS', '')

          if not access_token:
              print("❌ Error: Mastodon Access Token is missing in Secrets.")
              exit(1)

          try:
              # Εξασφαλίζουμε ότι το URL έχει https
              if not instance_url.startswith('http'):
                  instance_url = 'https://' + instance_url
              
              mastodon = Mastodon(access_token=access_token, api_base_url=instance_url)
              
              # Σύνδεση Hashtags στο κείμενο
              full_text = f"{content}\n\n{hashtags}".strip()
              
              mastodon_status = mastodon.status_post(full_text)
              print(f"✅ Successfully posted to Mastodon: {mastodon_status.url}")
          except Exception as e:
              print(f"❌ Failed to post to Mastodon: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Log Success
        if: always()
        run: |
          echo "Workflow execution finished."
          echo "Check the logs above for specific posting status."