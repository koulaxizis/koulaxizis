name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky;'
        required: true
        type: boolean
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon;'
        required: true
        type: boolean

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # --- NEW DEBUG STEP ---
      - name: Verify Secrets Presence
        run: |
          echo "Checking for BLUESKY_USERNAME..."
          if [ -z "${{ secrets.BLUESKY_USERNAME }}" ]; then
             echo "ERROR: BLUESKY_USERNAME is empty. Check Repository Secrets -> Actions."
             exit 1
          fi
          echo "Checking for BLUESKY_PASSWORD..."
          if [ -z "${{ secrets.BLUESKY_PASSWORD }}" ]; then
             echo "ERROR: BLUESKY_PASSWORD is empty. Check Repository Secrets -> Actions."
             exit 1
          fi
          echo "Checking for MASTODON_ACCESS_TOKEN..."
          if [ -z "${{ secrets.MASTODON_ACCESS_TOKEN }}" ]; then
             echo "ERROR: MASTODON_ACCESS_TOKEN is empty. Check Repository Secrets -> Actions."
             exit 1
          fi
          echo "✅ All required secrets are present and valid."
          # --------------------------------

      - name: Install dependencies
        run: |
          pip install atproto mastodon.py
      
      - name: Post to BlueSky
        if: github.event.inputs.bluesky_post == 'true'
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          HASHTAGS: ${{ github.event.inputs.tags }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          from atproto import Client, client_utils

          # Βεβαιωθείτε ότι το Python παίρνει πραγματικά τις μεταβλητές
          username = os.environ.get('BLUESKY_USERNAME', '').strip()
          password = os.environ.get('BLUESKY_PASSWORD', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          hashtags = os.environ.get('HASHTAGS', '').strip()

          print(f"DEBUG: Username length = {len(username)}")
          print(f"DEBUG: Password length = {len(password)}")

          if not username or not password:
              print("❌ Error: BlueSky credentials are still empty after export.")
              exit(1)

          try:
              client = Client()
              client.login(username, password)

              full_text = f"{content}\n\n{hashtags}".strip()
              doc = client_utils.TextBuilder().text(full_text)
              
              reply_data = client.send_post(doc)
              print(f"✅ Posted to BlueSky: {reply_data.uri}")
          except Exception as e:
              print(f"❌ Failed to post to BlueSky: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Post to Mastodon
        if: github.event.inputs.mastodon_post == 'true'
        env:
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL || 'https://mastodon.social' }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          HASHTAGS: ${{ github.event.inputs.tags }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          from mastodon import Mastodon

          instance_url = os.environ.get('MASTODON_INSTANCE_URL', 'https://mastodon.social').strip()
          access_token = os.environ.get('MASTODON_ACCESS_TOKEN', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          hashtags = os.environ.get('HASHTAGS', '').strip()

          if not access_token:
              print("❌ Error: Mastodon Access Token is empty.")
              exit(1)

          try:
              if not instance_url.startswith('http'):
                  instance_url = 'https://' + instance_url
              
              mastodon = Mastodon(access_token=access_token, api_base_url=instance_url)
              
              full_text = f"{content}\n\n{hashtags}".strip()
              
              mastodon_status = mastodon.status_post(full_text)
              print(f"✅ Posted to Mastodon: {mastodon_status.url}")
          except Exception as e:
              print(f"❌ Failed to post to Mastodon: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Log Success
        if: always()
        run: |
          echo "Workflow execution finished."