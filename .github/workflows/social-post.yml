name: Social Media Auto-Post

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Το κείμενο της ανάρτησης'
        required: true
        type: string
      tags:
        description: 'Tags (χωρισμένα με κενό)'
        required: false
        type: string
      display_date:
        description: 'Ημερομηνία εμφάνισης'
        required: false
        type: string
      bluesky_post:
        description: 'Δημοσίευση στο BlueSky;'
        required: true
        type: boolean
      mastodon_post:
        description: 'Δημοσίευση στο Mastodon;'
        required: true
        type: boolean
      hashtags_convert:
        description: 'Μετατροπή emojis σε hashtags;'
        required: false
        type: boolean
        default: false

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install atproto mastodon.py

      - name: Post to BlueSky
        if: github.event.inputs.bluesky_post == 'true'
        env:
          BS_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BS_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import re
          from atproto import Client, client_utils

          username = os.environ.get('BS_USERNAME', '').strip()
          password = os.environ.get('BS_PASSWORD', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '').strip()
          convert_emojis = os.environ.get('CONVERT_EMOJIS', 'false').lower() == 'true'

          print(f"DEBUG [BlueSky]: Convert Emojis = {convert_emojis}")
          print(f"DEBUG [BlueSky]: Raw Tags = '{tags_input}'")

          if not username or not password:
              print("❌ Error: BlueSky credentials missing.")
              exit(1)

          final_suffix = ""

          if tags_input:
              # Διαχωρίζουμε τα tags (μπορεί να έχουν multiple spaces)
              raw_tags = [t.strip() for t in re.split(r'\s+', tags_input) if t.strip()]
              
              if convert_emojis and raw_tags:
                  generated_hashtags = []
                  for tag in raw_tags:
                      # Αφαίρεση όλων των μη αλφαριθμητικών χαρακτήρων (emojis, σύμβολα)
                      # Κρατάμε μόνο τις λέξεις (Unicode letters & digits)
                      cleaned = re.sub(r'[^\w]', '', tag, flags=re.UNICODE).strip()
                      
                      # Αν απομείνει κάτι (π.χ. "Βιβλία" από "📚 Βιβλία" ή απλά "Βιβλία")
                      if cleaned:
                          hashtag = f"#{cleaned}"
                          generated_hashtags.append(hashtag)
                  
                  if generated_hashtags:
                      final_suffix = "\n\n" + " ".join(generated_hashtags)
                      print(f"DEBUG [BlueSky]: Generated Hashtags -> {final_suffix}")
                  else:
                      print(f"DEBUG [BlueSky]: No text found in tags to convert. Skipping suffix.")
              elif not convert_emojis:
                  # Αν ΔΕΝ ζητείται μετατροπή, ΔΕΝ στέλνουμε κανένα suffix (ούτε emojis)
                  print(f"DEBUG [BlueSky]: Conversion disabled. Tags ignored.")
                  final_suffix = ""

          try:
              client = Client()
              client.login(username, password)

              full_text = f"{content}{final_suffix}".strip()

              doc = client_utils.TextBuilder().text(full_text)
              reply_data = client.send_post(doc)
              print(f"✅ Posted to BlueSky: {reply_data.uri}")
              print(f"CONTENT SENT: '{full_text}'")
          except Exception as e:
              print(f"❌ Failed to post to BlueSky: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Post to Mastodon
        if: github.event.inputs.mastodon_post == 'true'
        env:
          MA_INSTANCE: ${{ secrets.MASTODON_INSTANCE_URL || 'https://mastodon.social' }}
          MA_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_CONTENT: ${{ github.event.inputs.content }}
          TAGS_INPUT: ${{ github.event.inputs.tags }}
          CONVERT_EMOJIS: ${{ github.event.inputs.hashtags_convert }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import re
          from mastodon import Mastodon

          instance_url = os.environ.get('MA_INSTANCE', 'https://mastodon.social').strip()
          access_token = os.environ.get('MA_TOKEN', '').strip()
          content = os.environ.get('POST_CONTENT', '').strip()
          tags_input = os.environ.get('TAGS_INPUT', '').strip()
          convert_emojis = os.environ.get('CONVERT_EMOJIS', 'false').lower() == 'true'

          print(f"DEBUG [Mastodon]: Convert Emojis = {convert_emojis}")
          print(f"DEBUG [Mastodon]: Raw Tags = '{tags_input}'")

          if not access_token:
              print("❌ Error: Mastodon Access Token missing.")
              exit(1)

          final_suffix = ""

          if tags_input:
              raw_tags = [t.strip() for t in re.split(r'\s+', tags_input) if t.strip()]
              
              if convert_emojis and raw_tags:
                  generated_hashtags = []
                  for tag in raw_tags:
                      # Αφαίρεση non-word characters (emojis), κρατάμε Unicode κείμενο
                      cleaned = re.sub(r'[^\w]', '', tag, flags=re.UNICODE).strip()
                      if cleaned:
                          hashtag = f"#{cleaned}"
                          generated_hashtags.append(hashtag)
                  
                  if generated_hashtags:
                      final_suffix = "\n\n" + " ".join(generated_hashtags)
                      print(f"DEBUG [Mastodon]: Generated Hashtags -> {final_suffix}")
                  else:
                      print(f"DEBUG [Mastodon]: No text found in tags to convert. Skipping suffix.")
              elif not convert_emojis:
                  print(f"DEBUG [Mastodon]: Conversion disabled. Tags ignored.")
                  final_suffix = ""

          try:
              if not instance_url.startswith('http'):
                  instance_url = 'https://' + instance_url
              
              mastodon = Mastodon(access_token=access_token, api_base_url=instance_url)

              full_text = f"{content}{final_suffix}".strip()
              
              mastodon_status = mastodon.status_post(full_text)
              print(f"✅ Posted to Mastodon: {mastodon_status.url}")
              print(f"CONTENT SENT: '{full_text}'")
          except Exception as e:
              print(f"❌ Failed to post to Mastodon: {str(e)}")
              exit(1)
          PYTHON_SCRIPT

      - name: Log Success
        if: always()
        run: |
          echo "Workflow execution finished."
          echo "Check logs above for content details."