name: Generate RSS Feed

on:
  push:
    paths:
      - 'updates.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Ενημερωμένο σε v4

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Ενημερωμένο σε v4
        with:
          node-version: '20'  # Μπορούμε να κρατήσουμε το 20 ή να βάλουμε 'lts/*'

      - name: Run Script
        run: node generate-rss.js

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feed.xml
          git diff --staged --quiet || git commit -m "Auto-update RSS Feed [skip ci]"
          git push
