name: Update download counts

on:
  schedule:
    # Every 4 hours: GitHub often drops scheduled runs, so one daily tick is not
    # enough. Only the first run of each Athens day changes downloads.json.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Count downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_IF_TODAY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node update-downloads.js

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add downloads.json
          git diff --staged --quiet || git commit -m "Auto-update download counts [skip ci]"
          git push
